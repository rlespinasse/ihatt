version: 2

builds:
  - id: default
    binary: ihatt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rlespinasse/ihatt/cmd.version={{.Version}}
  - id: darwin
    binary: ihatt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/rlespinasse/ihatt/cmd.version={{.Version}}

signs:
  - cmd: rcodesign
    args:
      - sign
      - "${artifact}"
    ids:
      - darwin
    artifacts: binary
    output: false

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

homebrew_casks:
  - repository:
      owner: rlespinasse
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/rlespinasse/ihatt
    description: CLI/TUI temporal knowledge base over local git repos
    binaries:
      - ihatt
    caveats: |
      macOS Gatekeeper notice: this binary is signed but not notarized by Apple.
      On first run, macOS may block it. If so, allow it via:
        System Settings > Privacy & Security > "Allow Anyway"
      or run:
        xattr -d com.apple.quarantine $(brew --prefix)/bin/ihatt
